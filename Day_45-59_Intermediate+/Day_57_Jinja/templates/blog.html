<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blog</title>
</head>
<body>
    {% for blog_post in blog_posts: %}
    {% if blog_post.get('id') == 2 %}
        <h1>{{ blog_post.get('title') }}</h1>
        <h2>{{ blog_post.get('subtitle') }}</h2>
    {% endif %}
    {% endfor  %}
</body>
</html>
